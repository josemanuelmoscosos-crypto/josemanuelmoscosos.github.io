    /* ---------- A partir de aquí no necesitas cambiar nada ---------- */
    const caja = document.getElementById("resultados");
    const conteo = document.getElementById("conteo");
    const vacio = document.getElementById("vacio");
    const campo = document.getElementById("buscar");

    const limpiar = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

    function dibujar(lista) {
      caja.textContent = "";
      lista.forEach(l => {
        const d = document.createElement("details");
        d.className = "linea";

        const s = document.createElement("summary");
        const n = document.createElement("span");
        n.className = "numero"; n.textContent = l.numero;
        const txt = document.createElement("div");
        const h = document.createElement("h2"); h.textContent = l.nombre;
        const p = document.createElement("small");
        p.textContent = l.paradas[0] + " a " + l.paradas[l.paradas.length - 1];
        txt.append(h, p);
        s.append(n, txt);

        const ol = document.createElement("ol");
        ol.className = "paradas";
        l.paradas.forEach(x => { const li = document.createElement("li"); li.textContent = x; ol.append(li); });

        d.append(s, ol);
        caja.append(d);
      });
      vacio.hidden = lista.length > 0;
      conteo.textContent = lista.length === LINEAS.length
        ? LINEAS.length + " líneas disponibles"
        : lista.length + " de " + LINEAS.length + " líneas";
    }

    campo.addEventListener("input", () => {
      const q = limpiar(campo.value);
      const filtradas = LINEAS.filter(l =>
        limpiar(l.numero + " " + l.nombre + " " + l.paradas.join(" ")).includes(q)
      );
      dibujar(filtradas);
    });

    dibujar(LINEAS);
  </script>
